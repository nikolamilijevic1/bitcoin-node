# Local-only routing for mainnet. No upstream public explorer proxy.
access_log off;
error_log /var/log/nginx/error_mempool.log;
root /var/www/mempool/browser;
index index.html;
resolver 127.0.0.11 valid=5s ipv6=off;
set $backend api:8999;
set $indexer electrs:3002;
add_header Cache-Control "no-store" always;
sub_filter_once on;
sub_filter '</head>' '<style>body::before{content:"MAINNET — local read-only explorer";display:block;background:#163859;color:#d6ecff;text-align:center;font:600 13px system-ui;padding:7px}</style></head>';
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws:; worker-src 'self' blob:; frame-src 'none'" always;
location / {
    try_files /$lang/$uri /$lang/$uri/ $uri $uri/ /en-US/$uri @index-redirect;
}
location @index-redirect {
    rewrite (.*) /$lang/index.html;
}
location /resources {
    try_files $uri =404;
}
location /api/v1/services { return 404; }
location /disabled-services { return 404; }
location /api/v1/ws {
    proxy_pass http://$backend/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
}
location /api/v1 {
    limit_except GET { deny all; }
    proxy_pass http://$backend;
}
location /api/ {
    limit_except GET { deny all; }
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$indexer;
}
location /ws {
    proxy_pass http://$backend/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
}
