# Only this gateway joins a non-internal network. It proxies fixed local services.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
resolver 127.0.0.11 valid=5s ipv6=off;
server {
    listen 8080;
    set $explorer web:8080;
    access_log off;
    location / {
        proxy_pass http://$explorer;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
server {
    listen 8081;
    set $guide lab:9100;
    access_log off;
    location / { proxy_pass http://$guide; }
}
server {
    listen 8082;
    set $dashboard grafana:3000;
    access_log off;
    location / {
        proxy_pass http://$dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
