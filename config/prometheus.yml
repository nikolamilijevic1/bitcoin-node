global:
  scrape_interval: 15s
scrape_configs:
  - job_name: bitcoin-lab
    static_configs:
      - targets: ['lab:9100']
  - job_name: electrs
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ['electrs:4224']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
